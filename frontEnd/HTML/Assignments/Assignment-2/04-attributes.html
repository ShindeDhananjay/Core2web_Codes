<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attributes in Action</title>
</head>
<body>
  <h1>HTML Attributes</h1>
  <p title="This extra information appears when you hover over this paragraph.">
    Move your pointer over this paragraph.
  </p>
  <p class="student">Student 1: Dhananjay</p>
  <p class="student">Student 2: Computer Engineering student</p>
  <p class="student">Student 3: Full-Stack and AI learner</p>
  <p id="student-one">Unique ID: student-one</p>
  <p id="student-two">Unique ID: student-two</p>
  <p id="student-three">Unique ID: student-three</p>
  <img
    src="images/html-building-blocks.svg"
    alt="Illustration of HTML building blocks"
    width="320"
    height="180"
  >
</body>
</html>
