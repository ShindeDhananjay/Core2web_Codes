<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>SVG Playground</title></head>
<body>
  <h1>SVG Playground</h1>
  <p>SVG is a vector graphic format. Its shapes stay sharp when resized.</p>
  <svg width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="Circle, rectangle, and line examples">
    <circle cx="70" cy="75" r="40" fill="skyblue" stroke="navy" stroke-width="3"></circle>
    <rect x="140" y="35" width="100" height="80" fill="lightgreen" stroke="darkgreen" stroke-width="3"></rect>
    <line x1="275" y1="35" x2="365" y2="115" stroke="red" stroke-width="5"></line>
  </svg>
</body>
</html>
